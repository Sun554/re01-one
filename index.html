<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动切换图片动画网页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 20px;
            color: #fff; /* 标题文字颜色改为白色 */
            font-size: 32px; /* 增大字体大小 */
            font-weight: bold; /* 字体加粗 */
            background-color: #333; /* 添加背景颜色 */
            padding: 15px 30px; /* 增加内边距 */
            border-radius: 8px; /* 圆角边框 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* 添加阴影 */
            text-transform: uppercase; /* 标题文字大写 */
            letter-spacing: 2px; /* 增加字母间距 */
        }

       .slideshow-container {
            position: relative;
            width: 80%;
            max-width: 1000px;
            height: 500px;
            overflow: hidden;
        }

       .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: fade 5s infinite;
        }

       .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fade {
            0%, 100% {
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
        }
    </style>
</head>


<body>
    <h1>斯奈德</h1><!-- 添加标题 -->
    <div class="slideshow-container">
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yL4KH.jpeg" alt="yL4KH.jpeg" border="0">
        </div>
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yLdOU.jpeg" alt="yLdOU.jpeg" border="0">
        </div>
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yLlgX.jpeg" alt="yLlgX.jpeg" border="0">
        </div>
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yLtoQ.jpeg" alt="yLtoQ.jpeg" border="0">
        </div>
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yLKNF.jpeg" alt="yLKNF.jpeg" border="0">
        </div>
        <div class="slide">
            <img src="https://i.imgs.ovh/2025/03/23/yLIUm.jpeg" alt="yLIUm.jpeg" border="0">
        </div>
         <div class="slide">
             <img src="https://i.imgs.ovh/2025/03/23/yLhW9.jpeg" alt="yLhW9.jpeg" border="0">
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        slides.forEach((slide, index) => {
            slide.style.animationDelay = `${index * 5}s`;
        });
    </script>
</body>

</html>
